<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0a0a0a; color: #e0e0e0;
      width: 280px; padding: 16px;
    }
    h1 { font-size: 1.1rem; color: #7dd3fc; margin-bottom: 4px; }
    p { font-size: 0.78rem; color: #666; margin-bottom: 12px; line-height: 1.4; }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      background: #2563eb; color: white; font-family: inherit;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .info { margin-top: 12px; font-size: 0.7rem; color: #444; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>kuro 🐈‍⬛</h1>
  <p>Browser agent — sees what's visible, clicks what's clickable.</p>
  <button id="openPanel">Open Side Panel</button>
  <div class="info">
    Click the button to open kuro in the side panel.
    It can read, click, type, navigate, and automate any webpage.
  </div>
  <script src="popup.js"></script>
</body>
</html>
